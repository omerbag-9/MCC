name: Copy dev content to production

# Run by hand from the Actions tab, once, before production's first deploy: copies the content
# (database and media) from dev to the empty production database and bucket. Leads and other
# dev-only data are not copied. See scripts/copy-data.mjs. Delete this workflow after launch.
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/copy-data.mjs
        env:
          FROM_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FROM_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FROM_D1_DATABASE_ID: 1338b2b0-7a68-4da8-8419-2452541e29e8
          FROM_R2_BUCKET: mcc-bucket
          TO_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TO_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TO_D1_DATABASE_ID: 1740576b-2b25-4f66-8a9d-4cfa31123e4d
          TO_R2_BUCKET: mcc-media
