name: Deploy

# Push to dev -> deploys dev; push to production -> deploys mccltd-eg.com (see scripts/deploy.mjs
# for the steps). Each branch uses the GitHub environment of the same name for its secrets.
on:
  push:
    branches: [dev, production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Checks before anything is deployed. scripts/deploy.mjs then also runs the built site
      # locally, checks it, deploys, checks the live site and rolls back automatically on failure.
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/deploy.mjs ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
