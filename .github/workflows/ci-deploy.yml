name: CI & Deploy

# Pull requests: lint + typecheck + build.
# Pushes to dev / staging / production: the same checks, then migrate the D1 database, deploy to the
# matching Cloudflare environment (see wrangler.jsonc), copy secrets to the Worker and refresh pages.
on:
  pull_request:
  push:
    branches: [dev, staging, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx opennextjs-cloudflare build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && contains(fromJSON('["dev","staging","production"]'), github.ref_name)
    runs-on: ubuntu-latest
    # GitHub environment with the same name: holds its secrets and (optionally) required reviewers.
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Copied to the Worker by scripts/sync-secrets.mjs (empty ones are skipped).
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check credentials and config
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for the '$TARGET' environment. Skipping deploy (see README, 'Automatic deploys')."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! OUT=$(node scripts/check-config.mjs "$TARGET"); then
            echo "::warning::Skipping deploy: $(echo "$OUT" | tr '\n' ' ')"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        run: npm run db:migrate:$TARGET

      - name: Load demo content (dev, empty database only)
        if: steps.creds.outputs.ready == 'true' && github.ref_name == 'dev'
        run: node scripts/seed-if-empty.mjs dev

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = "dev" ]; then ENV_ARGS=""; else ENV_ARGS="--env $TARGET"; fi
          npx opennextjs-cloudflare deploy $ENV_ARGS 2>&1 | tee deploy.log
          test "${PIPESTATUS[0]}" -eq 0
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then echo "### Deployed $TARGET: $URL" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Copy secrets to the Worker
        if: steps.creds.outputs.ready == 'true'
        run: node scripts/sync-secrets.mjs $TARGET

      - name: Refresh public pages
        if: steps.creds.outputs.ready == 'true'
        env:
          # The workers.dev address printed by the deploy (dev); others use SITE_URL from wrangler.jsonc.
          SITE_URL: ${{ github.ref_name == 'dev' && steps.deploy.outputs.url || '' }}
        run: node scripts/post-deploy.mjs $TARGET
